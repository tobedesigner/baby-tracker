<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>成長里程碑</title>
    <meta name="description" content="成長里程碑時間軸" />
    <!-- 不要被搜尋引擎收錄：只有拿到網址的人看得到 -->
    <meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, noimageindex, nosnippet" />
    <meta name="theme-color" content="#F7F2EB" />
    <!-- 標題與數字用的襯線體，只載 700 一個字重；載不到就退回系統字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="成長里程碑" />
    <!-- 分享到 LINE 等地方的預覽圖；網址在 .env 的 VITE_SITE_URL，搬家時改那裡 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="成長里程碑" />
    <meta property="og:description" content="成長里程碑時間軸" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍼</text></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
